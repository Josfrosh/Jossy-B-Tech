<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Confirming payment | JossyB</title><meta name="robots" content="noindex,nofollow"><style>body{margin:0;background:#070f22;color:#f4efe2;font:16px/1.6 Inter,Arial,sans-serif}.box{max-width:640px;margin:14vh auto;padding:34px;border:1px solid rgba(201,162,39,.35);border-radius:18px;background:#0b1c3a}h1{font:600 2rem Georgia,serif}p{color:#a5b1c8}a{color:#e9c765}</style></head><body><main class="box"><h1>Confirming your payment</h1><p id="status" role="status" aria-live="polite">We’re waiting for Paystack’s signed payment confirmation. Please keep this page open for a moment.</p><p><a href="dashboard.html">Go to dashboard</a></p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="service-access.js"></script><script>
(async()=>{const status=document.getElementById('status');const params=new URLSearchParams(location.search);const reference=params.get('reference')||params.get('trxref')||'';const service=(params.get('service')||'').toLowerCase();const destinations={jobs:'resources-jobs.html',investing:'resources-investing.html',skills:'resources-skills.html',premium:'resources-premium.html'};if(!reference||!destinations[service]){status.textContent='We could not match this return to a service checkout. Check your dashboard or contact support if your payment was successful.';return;}const api=window.JossyResourceAccess,client=window.supabase.createClient(api.SUPABASE_URL,api.SUPABASE_ANON_KEY);const {data,error}=await client.auth.getSession();if(error||!data.session?.user){location.replace('login.html?next='+encodeURIComponent('payment-return.html'+location.search));return;}const user=data.session.user;for(let attempt=0;attempt<30;attempt++){try{const result=await client.from('payments').select('plan,status').eq('paystack_ref',reference).eq('user_id',user.id).maybeSingle();if(result.error)throw result.error;if(result.data?.status==='success'&&result.data.plan===service){status.textContent='Payment confirmed. Opening your '+service+' resources…';location.replace(destinations[service]);return;}}catch(e){console.warn('Payment confirmation is still pending',e);}await new Promise(resolve=>setTimeout(resolve,2000));}status.textContent='Your payment may still be processing. Access is released only after Paystack confirms it. Refresh this page in a moment or check your dashboard; if you were charged and access remains missing, contact support.';})();
</script></body></html>
