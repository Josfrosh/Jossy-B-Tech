<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account – JossyB</title>
  <style>
    :root {
      --navy-950: #070f22;
      --navy-900: #0b1e3d;
      --navy-800: #142850;
      --gold-500: #c9a227;
      --gold-400: #e0c15a;
      --cream-100: #f5f1e8;
      --ink-300: rgba(245, 241, 232, 0.66);
      --ink-500: rgba(245, 241, 232, 0.42);
      --error: #ef4444;
      --line: rgba(245, 241, 232, 0.12);
      --radius: 14px;
      --font-display: 'Fraunces', serif;
      --font-body: 'Inter', sans-serif;
      --font-mono: 'IBM Plex Mono', monospace;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: radial-gradient(1100px 500px at 85% -10%, rgba(201, 162, 39, 0.14), transparent 60%),
                  var(--navy-950);
      color: var(--cream-100);
      font-family: var(--font-body);
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      width: 100%;
      max-width: 420px;
    }
    .card {
      background: var(--navy-900);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 40px 32px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 30px;
      text-decoration: none;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 1.15rem;
      letter-spacing: 0.02em;
      color: var(--cream-100);
    }
    .brand-mark {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      background: linear-gradient(145deg, var(--gold-400), var(--gold-500));
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--navy-950);
      font-weight: 700;
      font-size: 0.9rem;
    }
    h1 {
      font-family: var(--font-display);
      font-size: 1.75rem;
      font-weight: 600;
      margin: 0 0 10px;
    }
    .subtitle {
      color: var(--ink-300);
      font-size: 0.95rem;
      margin-bottom: 28px;
    }
    .form-group {
      margin-bottom: 18px;
    }
    label {
      display: block;
      font-family: var(--font-mono);
      font-size: 0.68rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ink-500);
      margin-bottom: 6px;
    }
    input[type="email"],
    input[type="password"],
    input[type="text"] {
      background: var(--navy-800);
      border: 1px solid var(--line);
      width: 100%;
      color: var(--cream-100);
      border-radius: 10px;
      outline: none;
      padding: 0.7rem 0.9rem;
      font-size: 0.95rem;
      transition: border-color 0.15s;
    }
    input:focus {
      border-color: var(--gold-400);
    }
    input::placeholder {
      color: var(--ink-500);
    }
    .error-message {
      display: none;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-top: 14px;
      text-align: center;
    }
    .error-message.show {
      display: block;
    }
    .checkbox-group {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 20px;
      font-size: 0.9rem;
    }
    .checkbox-group input[type="checkbox"] {
      width: auto;
      margin: 4px 0 0;
      cursor: pointer;
    }
    .checkbox-group label {
      margin: 0;
      text-transform: none;
      letter-spacing: normal;
      font-family: var(--font-body);
      color: var(--ink-300);
      cursor: pointer;
    }
    .checkbox-group a {
      color: var(--gold-400);
      text-decoration: none;
    }
    .checkbox-group a:hover {
      text-decoration: underline;
    }
    button[type="submit"] {
      background: linear-gradient(145deg, var(--gold-400), var(--gold-500));
      color: var(--navy-950);
      width: 100%;
      border: none;
      border-radius: 999px;
      padding: 12px 24px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s, opacity 0.15s;
    }
    button[type="submit"]:hover {
      transform: translateY(-1px);
    }
    button[type="submit"]:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 24px 0;
      color: var(--ink-500);
      font-size: 0.85rem;
    }
    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--line);
    }
    .oauth-button {
      background: var(--navy-800);
      border: 1px solid var(--line);
      color: var(--cream-100);
      width: 100%;
      border-radius: 10px;
      padding: 10px 16px;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.15s;
      font-family: var(--font-body);
    }
    .oauth-button:hover {
      border-color: var(--gold-400);
      color: var(--gold-400);
    }
    .footer-link {
      text-align: center;
      margin-top: 20px;
      color: var(--ink-300);
      font-size: 0.9rem;
    }
    .footer-link a {
      color: var(--gold-400);
      text-decoration: none;
    }
    .footer-link a:hover {
      text-decoration: underline;
    }
    .helper-text {
      color: var(--ink-500);
      font-size: 0.8rem;
      margin-top: 4px;
    }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
</head>
<body>

<div class="container">
  <div class="card">
    <a href="index.html" class="brand">
      <span class="brand-mark">JB</span>
      <span>JOSSYB</span>
    </a>
    
    <h1>Create Account</h1>
    <p class="subtitle">Join us and start growing today</p>

    <form id="registerForm">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required placeholder="you@example.com">
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required placeholder="Min. 8 characters">
        <p class="helper-text">At least 8 characters</p>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <input type="password" id="confirmPassword" name="confirmPassword" required placeholder="Re-enter your password">
      </div>

      <div class="form-group">
        <label for="referralCode">Referral Code (Optional)</label>
        <input type="text" id="referralCode" name="referralCode" placeholder="Enter a referral code if you have one">
      </div>

      <div class="form-group">
        <div class="checkbox-group">
          <input type="checkbox" id="terms" name="terms" required>
          <label for="terms">I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a></label>
        </div>
      </div>

      <div class="error-message" id="errorMessage"></div>

      <button type="submit" id="submitBtn">Create Account</button>
    </form>

    <div class="divider">OR</div>

    <button class="oauth-button" id="googleBtn" type="button">Continue with Google</button>

    <div class="footer-link">
      Already have an account? <a href="login.html">Log in</a>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth.js"></script>
<script>
  // Redirect if already logged in
  (async () => {
    await redirectIfLoggedIn();
  })();

  const form = document.getElementById('registerForm');
  const emailInput = document.getElementById('email');
  const passwordInput = document.getElementById('password');
  const confirmPasswordInput = document.getElementById('confirmPassword');
  const referralInput = document.getElementById('referralCode');
  const errorMsg = document.getElementById('errorMessage');
  const submitBtn = document.getElementById('submitBtn');
  const googleBtn = document.getElementById('googleBtn');

  // Populate referral code if in URL
  function initReferralCode() {
    const ref = getReferralCode();
    if (ref) {
      referralInput.value = ref;
    }
  }
  initReferralCode();

  // Show error
  function showError(message) {
    errorMsg.textContent = message;
    errorMsg.classList.add('show');
  }

  // Clear error
  function clearError() {
    errorMsg.classList.remove('show');
  }

  // Form validation
  function validateForm() {
    clearError();
    const email = emailInput.value.trim();
    const password = passwordInput.value;
    const confirmPassword = confirmPasswordInput.value;

    if (!email || !isValidEmail(email)) {
      showError('Please enter a valid email address');
      return false;
    }

    if (!isValidPassword(password)) {
      showError('Password must be at least 8 characters');
      return false;
    }

    if (password !== confirmPassword) {
      showError('Passwords do not match');
      return false;
    }

    return true;
  }

  // Handle registration
  form.addEventListener('submit', async (e) => {
    e.preventDefault();

    if (!validateForm()) return;

    submitBtn.disabled = true;
    submitBtn.textContent = 'Creating account...';

    try {
      const email = emailInput.value.trim();
      const password = passwordInput.value;
      const referralCode = referralInput.value.trim() || null;

      const { data, error } = await supabase.auth.signUp({
        email,
        password,
      });

      if (error) {
        if (error.message.includes('already registered')) {
          showError('This email is already registered. Please log in.');
        } else {
          showError(error.message || 'Registration failed. Please try again.');
        }
        submitBtn.disabled = false;
        submitBtn.textContent = 'Create Account';
        return;
      }

      // If email confirmation is disabled, Supabase may return an active session
      if (data.session) {
        // Email confirmation disabled: sign out immediately, then redirect to login
        await supabase.auth.signOut();
      }

      // Save referral code if provided
      if (data.user && referralCode) {
        await saveReferralCodeToProfile(data.user.id, referralCode);
      }

      // Clear pending referral from storage
      clearReferralCode();

      // Redirect to login with registered flag
      window.location.href = 'login.html?registered=1';
    } catch (err) {
      showError('An unexpected error occurred. Please try again.');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Create Account';
    }
  });

  // Google OAuth
  googleBtn.addEventListener('click', async () => {
    googleBtn.disabled = true;
    googleBtn.textContent = 'Redirecting...';

    const redirectUrl = getOAuthRedirectUrl('dashboard.html');
    const referralCode = referralInput.value.trim();

    try {
      const { error } = await supabase.auth.signInWithOAuth({
        provider: 'google',
        options: {
          redirectTo: redirectUrl,
          queryParams: {
            access_type: 'offline',
            prompt: 'consent',
          },
          ...(referralCode && { state: referralCode }), // Pass referral in state if needed
        },
      });

      if (error) {
        showError('Google sign-up failed. Please try again.');
        googleBtn.disabled = false;
        googleBtn.textContent = 'Continue with Google';
      }
    } catch (err) {
      showError('An error occurred. Please try again.');
      googleBtn.disabled = false;
      googleBtn.textContent = 'Continue with Google';
    }
  });
</script>
</body>
</html>
